version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - DOWNLOAD_DIR=/tmp/ytdlp_jobs
      - MAX_CONCURRENT_DOWNLOADS=2
      - JOB_TIMEOUT_SECONDS=600
      - CLEANUP_INTERVAL_SECONDS=180
      - JOB_TTL_SECONDS=900
    restart: unless-stopped
