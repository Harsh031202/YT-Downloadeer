services:
  - type: web
    name: streamforge-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: JOB_TIMEOUT_SECONDS
        value: "600"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "180"
      - key: JOB_TTL_SECONDS
        value: "900"
      - key: DOWNLOAD_DIR
        value: "/tmp/ytdlp_jobs"
